[base]
profile = "dev"
default_model = "change"

# ── Encoder ───────────────────────────────────────────────────
d_model = 128
n_heads = 4
n_enc_layers = 3
dropout = 0.1

# ── Training ──────────────────────────────────────────────────
weight_decay = 1e-4
grad_clip = 1.0
val_split = 0.1
seed = 42
log_every = 5
warmup_ratio = 0.1
label_smoothing = 0.1
scheduled_sampling = 0.5

# ── Inference ────────────────────────────────────────────────
beam_eval_interval = 0
beam_eval_sample = 0.2
beam_width = 5

# ── Route enumeration ────────────────────────────────────────
max_transfers = 2
max_routes_per_od = 3
transfer_penalty = 240

# ── Data paths (relative to repo root) ───────────────────────
[data]
gtfs_path = "data/tfl_station_data_gtfs.zip"
graph_dir = "data/graph"
pyg_dir = "data/pyg"
routes_path = "data/routes.json"
checkpoint_dir = "checkpoints"
target_crs = 27700

[filter]
region = "Greater London"

[analysis]
calendar_start = ""
calendar_end = ""

[plot]
output = "data/graph/network.png"
dpi = 150
title = "London Tube Network — travel time (colour) & frequency (width)"

# ── Model-specific overrides ─────────────────────────────────
[model.line]
max_seq = 4

[model.change]
max_seq = 4
label_smoothing = 0.0

[model.station]
max_seq = 40
label_smoothing = 0.0
scheduled_sampling = 0.5

[model.nexthop]
max_seq = 60

# ── Profiles ─────────────────────────────────────────────────
[profiles.dev]
epochs = 20
batch_size = 256
lr = 5e-4
beam_eval_sample = 0.1

[profiles.dev.model.station]
batch_size = 128

[profiles.dev.model.nexthop]
batch_size = 2048
lr = 5e-4
n_enc_layers = 12

[profiles.full]
epochs = 200
batch_size = 8192
lr = 5.7e-4
d_model = 512
n_heads = 8
n_enc_layers = 6
dropout = 0.1
weight_decay = 1e-4

[profiles.full.model.change]
epochs = 150

[profiles.full.model.station]
max_seq = 50
batch_size = 192
lr = 2.8e-4
beam_width = 20
epochs = 100
beam_eval_interval = 25

[profiles.full.model.nexthop]
batch_size = 4096
lr = 3e-4
epochs = 80
n_enc_layers = 12
