[base]
profile = "dev"
default_model = "nexthop"
eval_only = false
value_primary = false
transfer_discount = 1.5

# ── Encoder ───────────────────────────────────────────────────
d_model = 128
n_heads = 4
n_enc_layers = 3
dropout = 0.1

# ── Training ──────────────────────────────────────────────────
weight_decay = 1e-4
grad_clip = 1.0
val_split = 0.1
seed = 42
log_every = 5
warmup_ratio = 0.1
label_smoothing = 0.1
scheduled_sampling = 0.5

# ── Inference ────────────────────────────────────────────────
beam_eval_interval = 0
beam_eval_sample = 0.2
beam_width = 5

# ── Route enumeration ────────────────────────────────────────
max_transfers = 4
max_routes_per_od = 3
transfer_penalty = 0 # 240

# ── Data paths (relative to repo root) ───────────────────────
[data]
gtfs_path = "data/tfl_station_data_gtfs.zip"
graph_dir = "data/graph"
pyg_dir = "data/pyg"
routes_path = "data/routes.json"
checkpoint_dir = "checkpoints"
target_crs = 27700
interchange_path = "data/interchange_times.json"
modes = ["tube", "elizabeth-line", "dlr", "overground", "tram"]
timetable_dir = "data/timetables"

[data.pdf_timetables.elizabeth]
filename = "elizabeth-line-december-2025.pdf"

[data.pdf_timetables.liberty]
filename = "lo-liberty-line-timetable-december-2025.pdf"

[data.pdf_timetables.lioness]
filename = "lo-lioness-line-timetable-december-2025.pdf"

[data.pdf_timetables.mildmay]
filename = "lo-mildmay-line-timetable-december-2025.pdf"

[data.pdf_timetables.suffragette]
filename = "lo-suffragette-line-timetable-december-2025.pdf"

[data.pdf_timetables.weaver]
filename = "lo-weaver-line-timetable-december-2025.pdf"

[data.pdf_timetables.windrush]
filename = "lo-windrush-line-timetable-december-2025.pdf"

[data.missing_stops.HUBCUS]
name = "Custom House"
lat = 51.5095
lon = 0.0255
hub = "HUBCUS"

[data.missing_stops."910GBKRVS"]
name = "Barking Riverside"
lat = 51.5191
lon = 0.1148

[data.missing_stops."910GBATRSPK"]
name = "Battersea Park"
lat = 51.47696
lon = -0.147533

[filter]
region = "Greater London"

[analysis]
calendar_start = ""
calendar_end = ""

[plot]
output = "data/graph/network.png"
dpi = 150
title = "London Tube Network — travel time (colour) & frequency (width)"

[hub]
nexthop_policy = "permutans/tube-nexthop-policy"
nexthop_value = "permutans/tube-distance-field"

# ── Model-specific overrides ─────────────────────────────────
[model.nexthop]
max_seq = 60

# ── Profiles ─────────────────────────────────────────────────
[profiles.dev]
epochs = 20
batch_size = 256
lr = 5e-4
beam_eval_sample = 0.1

[profiles.dev.model.nexthop]
batch_size = 2048
lr = 5e-4
n_enc_layers = 16

[profiles.full]
epochs = 200
batch_size = 8192
lr = 5.7e-4
d_model = 512
n_heads = 8
n_enc_layers = 6
dropout = 0.1
weight_decay = 1e-4

[profiles.full.model.nexthop]
batch_size = 4096
lr = 3e-4
epochs = 80
n_enc_layers = 16
